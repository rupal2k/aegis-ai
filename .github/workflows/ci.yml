name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  security:
    name: Security & SAST Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: SAST — Bandit static analysis
        run: bandit -r ingestion ml_engine dashboard -ll -f json -o bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Dependency CVE scan — pip-audit
        run: |
          pip-audit -r requirements.docker.txt --format json -o pip-audit-report.json || true
          echo "### Pip-Audit Vulnerability Scan Summary" >> $GITHUB_STEP_SUMMARY || true
          pip-audit -r requirements.docker.txt --desc || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  test:
    name: Database, ML & API Tests
    runs-on: ubuntu-latest
    needs: security

    env:
      DATABASE_URL: postgresql://aegis_ci:aegis_ci_run_only@localhost:5432/aegis_test
      HASH_SALT: ${{ secrets.HASH_SALT || 'ci_test_salt_32_bytes_long_secret_hash_key' }}
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci_test_jwt_secret_key_at_least_32_bytes_long' }}
      AEGIS_USERS_JSON: ${{ secrets.AEGIS_USERS_JSON }}
      MLFLOW_TRACKING_URI: file:./mlruns
      MLFLOW_ALLOW_FILE_STORE: "true"

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aegis_ci
          POSTGRES_PASSWORD: aegis_ci_run_only
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.docker.txt

      - name: Generate synthetic data
        run: python data/generate.py

      - name: Load data into Postgres
        run: python data/load_to_db.py

      - name: Run data & normalizer tests
        run: python -m pytest tests/test_data.py tests/test_normalizer.py tests/test_excel_loader.py -v

      - name: Train model (abbreviated for CI)
        env:
          AEGIS_CI_FAST: "1"
        run: python -m ml_engine.training.train --no-hf

      - name: Run ML engine & actuarial tests
        run: python -m pytest tests/test_ml_engine.py tests/test_calibrate_premium.py tests/test_training_pipeline.py -v

      - name: Run API contract tests
        run: python -m pytest tests/test_api.py tests/test_predict_api.py -v

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dashboard
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-render:
    name: Deploy API to Render
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice ::Triggering Render deploy hook for aegis-api..."
            HTTP_CODE=$(curl -s -o deploy_response.txt -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Render deploy hook triggered successfully (HTTP $HTTP_CODE):"
              cat deploy_response.txt
            else
              echo "::error ::Render deploy hook returned failure status HTTP $HTTP_CODE"
              cat deploy_response.txt
              exit 1
            fi
          else
            echo "::notice ::RENDER_DEPLOY_HOOK_URL secret is not configured in repository settings. If your Render Blueprint (render.yaml) is linked with Git Auto-Deploy, Render deploys automatically on push to main."
          fi

  deploy-huggingface:
    name: Deploy Dashboard to Hugging Face Spaces
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "::notice ::Pushing to Hugging Face Spaces (Rupa2k/aegis-ai)..."
            git config --global user.email "ci@aegis.ai"
            git config --global user.name "Aegis AI CI"
            git remote add hf-space "https://Rupa2k:$HF_TOKEN@huggingface.co/spaces/Rupa2k/aegis-ai" || git remote set-url hf-space "https://Rupa2k:$HF_TOKEN@huggingface.co/spaces/Rupa2k/aegis-ai"
            git lfs install
            git push --force hf-space main:main
            echo "Hugging Face Space repository synced successfully."
          else
            echo "::notice ::HF_TOKEN secret is not configured in repository settings. Configure HF_TOKEN in GitHub repository secrets (Settings -> Secrets and variables -> Actions) with write access to deploy automatically to Hugging Face Spaces."
          fi
